pipeline:
  - { step: 1,  name: "abertura-de-pauta",       type: "checkpoint", output_file: "squads/conselho-364/output/pauta.md" }
  - { step: 2,  name: "enquadramento-ceo",        type: "agent", agent: "vicente-visao",  execution: "inline",  input_file: "squads/conselho-364/output/pauta.md", output_file: "squads/conselho-364/output/enquadramento.md" }
  - { step: 3,  name: "aprovar-enquadramento",    type: "checkpoint" }
  - { step: 4,  name: "pesquisa-de-mercado",      type: "agent", agent: "samuel-sonda",   execution: "subagent", model_tier: "powerful", input_file: "squads/conselho-364/output/enquadramento.md", output_file: "squads/conselho-364/output/pesquisa.md" }
  - { step: 5,  name: "mesa-de-especialistas",    type: "agent", agent: "priscila-prazo", execution: "inline",  input_file: "squads/conselho-364/output/pesquisa.md", output_file: "squads/conselho-364/output/contribuicoes.md" }
  - { step: 6,  name: "plano-operacional",        type: "agent", agent: "otavio-operacao", execution: "inline", input_file: "squads/conselho-364/output/contribuicoes.md", output_file: "squads/conselho-364/output/plano-operacional.md" }
  - { step: 7,  name: "analise-financeira",       type: "agent", agent: "fernanda-fluxo", execution: "inline",  input_file: "squads/conselho-364/output/plano-operacional.md", output_file: "squads/conselho-364/output/analise-financeira.md" }
  - { step: 8,  name: "indicadores",              type: "agent", agent: "bento-benchmark", execution: "inline", input_file: "squads/conselho-364/output/analise-financeira.md", output_file: "squads/conselho-364/output/indicadores.md" }
  - { step: 9,  name: "parecer-executivo",        type: "agent", agent: "priscila-prazo", execution: "inline",  input_file: "squads/conselho-364/output/indicadores.md", output_file: "squads/conselho-364/output/parecer-executivo.md" }
  - { step: 10, name: "revisao",                  type: "agent", agent: "rebeca-rigor",   execution: "inline",  input_file: "squads/conselho-364/output/parecer-executivo.md", output_file: "squads/conselho-364/output/revisao.md", on_reject: 9 }
  - { step: 11, name: "aprovacao-final",          type: "checkpoint" }

investigation:
  enriched: true
  profiles_analyzed: 6
  date: "2026-07-18"
  dir: "squads/conselho-364/_investigations"

research_brief: |
  KPIs restaurante BR 2026: CMV saudável 28–31% (alerta >35%); prime cost (CMV+mão de obra)
  60–70% da receita; mão de obra alvo 25–30%; margem operacional saudável 7–22% (McKinsey);
  turnover do setor >70%/ano. Congelados: margem-alvo 30–60%; distribuidoras operam com margem
  operacional 4–6%; precificação combina markup + margem de contribuição. Fontes: sults.com.br,
  controlenamao.com.br, cayena.com, infoprice.co, marcelopoliti.com.br, sebrae.com.br.
  Investigação Instagram (6 perfis): ver _investigations/consolidated-analysis.md.

